[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tab-transformer-nids"
version = "0.1.0"
description = "End-to-end TabTransformer network anomaly detection training and demo system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "channels>=4.2.0",
  "daphne>=4.2.0",
  "django>=5.2.0",
  "einops>=0.8.0",
  "joblib>=1.5.0",
  "matplotlib>=3.10.0",
  "numpy>=2.2.0",
  "pandas>=2.3.0",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.7.0",
  "seaborn>=0.13.2",
  "tab-transformer-pytorch==0.6.1",
  "torch>=2.9.0",
  "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-django>=4.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend_project.settings"
pythonpath = [
  "src",
  "apps/backend",
]
testpaths = ["tests"]
